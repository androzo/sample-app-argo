services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-dev-password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  hello-node-app:
    build: .
    image: hello-node-app:dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-dev-password
      POSTGRES_DB: appdb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: hello-node-frontend:dev
    ports:
      - "8080:80"
    depends_on:
      - hello-node-app
    restart: unless-stopped
