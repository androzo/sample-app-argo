apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-frontend
  labels:
    app.kubernetes.io/name: hello-node-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-node-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-node-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: hello-node-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-node-frontend
  labels:
    app.kubernetes.io/name: hello-node-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: hello-node-frontend
